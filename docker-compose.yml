name: argus

# Shared by all four services: one image, same env, same dependencies.
# Values fall back to sane defaults, so the stack boots before you write a .env.
x-service: &service
  build:
    context: .
  image: argus:dev
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://argus:argus@postgres:5432/argus}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    ARGUS_ENDPOINT: ${ARGUS_ENDPOINT:-http://ingestion:8001/v1/events}
    STREAM_NAME: ${STREAM_NAME:-llm.inference.v1}
    CONSUMER_GROUP: ${CONSUMER_GROUP:-ingest-workers}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # Defaults to mock so the stack works with no API key at all.
    DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-mock}
    ANSWER_MODEL: ${ANSWER_MODEL:-llama-3.3-70b-versatile}
    ROUTER_MODEL: ${ROUTER_MODEL:-llama-3.1-8b-instant}
  volumes:
    # Source only — never mount over /app/.venv.
    - ./services:/app/services
    - ./packages:/app/packages
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
      POSTGRES_DB: argus
    ports:
      # Host-side 5433 to stay clear of a locally installed Postgres on 5432.
      # Services talk to postgres:5432 over the compose network regardless.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus -d argus"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # 6380 host-side for symmetry with postgres; in-network it is redis:6379.
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  chat:
    <<: *service
    working_dir: /app/services
    command: ["uvicorn", "chat_app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  ingestion:
    <<: *service
    working_dir: /app/services
    command: ["uvicorn", "ingestion.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  dashboard:
    <<: *service
    working_dir: /app/services
    command: ["uvicorn", "dashboard.main:app", "--host", "0.0.0.0", "--port", "8002", "--reload"]
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    <<: *service
    working_dir: /app/services
    command: ["python", "-m", "worker.main"]
    # No HTTP surface — liveness is a heartbeat file, same probe shape k8s will use.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import os,sys,time
          p="/tmp/argus-worker.alive"
          sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < 60 else 1)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  pgdata:
  redisdata:
