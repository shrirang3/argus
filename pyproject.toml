[project]
name = "argus-monorepo"
version = "0.1.0"
description = "argus — every LLM call, watched."
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# `op` and `sa` are the migration API — the template imports them whether or not
# a given revision happens to use both.
"db/migrations/versions/*" = ["F401"]
# Service modules are imported after a sys.path insert, so the import cannot
# sit at the top of the file.
"tests/unit/test_ingestion.py" = ["E402"]
"tests/unit/test_worker.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
