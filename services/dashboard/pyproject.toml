[project]
name = "argus-dash"
version = "0.1.0"
description = "Metrics dashboard — latency, throughput, errors, cost, SDK health."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pydantic-settings>=2.7",
    "argus",
]

[tool.uv.sources]
argus = { workspace = true }
