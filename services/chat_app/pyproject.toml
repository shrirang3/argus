[project]
name = "argus-chat"
version = "0.1.0"
description = "Chat app — SSE streaming UI + LangGraph agent. Instrumented by argus."
requires-python = ">=3.12"
dependencies = [
    # web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "sse-starlette>=2.1",
    # data
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    # llm
    "groq>=0.13",
    "openai>=1.50",  # Cerebras is reached via this SDK, pointed at a different base_url
    "langgraph>=0.2.60",
    "langchain-core>=0.3.28",
    "langchain-groq>=0.2.3",
    # config
    "pyyaml>=6.0",
    "pydantic-settings>=2.7",
    # sdk under test
    "argus",
]

[tool.uv.sources]
argus = { workspace = true }
