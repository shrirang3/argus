# Template only — copy to secret.yaml, fill in real values, never commit that
# copy. `.gitignore` already excludes secret.yaml for exactly this reason.
#
# `stringData` (not `data`) accepts plain text and lets k8s do the base64
# encoding — `data` would require you to base64 the values yourself before
# writing them here, which is a needless step for a file no one but you reads.
apiVersion: v1
kind: Secret
metadata:
  name: argus-secrets
  namespace: argus
type: Opaque
stringData:
  POSTGRES_USER: argus
  POSTGRES_PASSWORD: argus
  POSTGRES_DB: argus
  GROQ_API_KEY: ""
  CEREBRAS_API_KEY: ""
