# Same shape as chat.yaml — see that file's comments for the reasoning behind
# envFrom, imagePullPolicy, and the probe choice. Port 8001, command differs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  namespace: argus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingestion
  template:
    metadata:
      labels:
        app: ingestion
    spec:
      containers:
        - name: ingestion
          image: argus:dev
          imagePullPolicy: Never
          workingDir: /app/services
          command: ["uvicorn", "ingestion.main:app", "--host", "0.0.0.0", "--port", "8001"]
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: argus-config
            - secretRef:
                name: argus-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion
  namespace: argus
spec:
  selector:
    app: ingestion
  ports:
    - port: 8001
      targetPort: 8001
